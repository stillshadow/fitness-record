name: Finalize fitness app V1.2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Clean final copy and remove temporary workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              '验证码在当前 Web App 内验证，不需要点击邮件链接跳到 Safari。支持 Supabase 配置的 6～10 位验证码。支持 Supabase 配置的 6～10 位验证码。',
              '验证码在当前 Web App 内验证，不需要点击邮件链接跳到 Safari。支持 Supabase 配置的 6～10 位验证码。'
          )
          p.write_text(s, encoding='utf-8')

          sw = Path('sw.js')
          t = sw.read_text(encoding='utf-8')
          t = re.sub(r"const CACHE='chibianying-fitness-v1-\d+';", "const CACHE='chibianying-fitness-v1-5';", t)
          sw.write_text(t, encoding='utf-8')
          PY

          git rm .github/workflows/patch-v12.yml

      - name: Commit final cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js .github/workflows/patch-v12.yml
          git commit -m "Finalize V1.2 OTP and goal-stage update"
          git push
