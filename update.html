<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>更新 池边影の健身记录</title>
<style>
html,body{margin:0;min-height:100%;background:#0a0e13;color:#f4f7fb;font:14px/1.6 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}body{display:grid;place-items:center;padding:24px;box-sizing:border-box}.card{width:min(420px,100%);background:#111720;border:1px solid #25313f;border-radius:18px;padding:20px;box-sizing:border-box}.title{font-size:18px;font-weight:800;margin-bottom:8px}.meta{color:#8d99aa}.ok{color:#4fd58d}.bad{color:#ff7380}
</style>
</head>
<body>
<div class="card">
  <div class="title">正在更新…</div>
  <div class="meta" id="status">正在清理旧缓存，不会删除你的健身记录。</div>
</div>
<script>
(async()=>{
  const status=document.getElementById('status');
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
    status.className='meta ok';
    status.textContent='更新完成，正在打开最新版…';
    setTimeout(()=>location.replace('./?fresh='+Date.now()),450);
  }catch(e){
    status.className='meta bad';
    status.textContent='自动更新失败，请关闭 App 后重新打开此页面。';
  }
})();
</script>
</body>
</html>
